<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Aston Martin Iconic Wings Emblem -->
  <defs>
    <linearGradient id="silverWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D8E2E6" />
      <stop offset="100%" stop-color="#9BA8B0" />
    </linearGradient>
    <linearGradient id="amrGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005A4E" />
      <stop offset="100%" stop-color="#00382F" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Outer Wing Feather Spans (Left) -->
    <path d="M 200,60 C 170,45 110,30 20,40 C 60,52 120,62 170,68 Z" fill="url(#silverWingGrad)" opacity="0.95" />
    <path d="M 200,62 C 175,50 120,42 40,50 C 75,58 130,68 175,73 Z" fill="url(#silverWingGrad)" opacity="0.9" />
    <path d="M 200,65 C 180,56 135,52 65,60 C 95,66 145,74 180,78 Z" fill="url(#silverWingGrad)" opacity="0.85" />
    <path d="M 200,68 C 185,62 150,60 90,68 C 115,73 155,79 185,82 Z" fill="url(#silverWingGrad)" opacity="0.8" />
    <path d="M 200,72 C 190,68 165,68 120,76 C 140,80 170,84 190,86 Z" fill="url(#silverWingGrad)" opacity="0.75" />

    <!-- Outer Wing Feather Spans (Right) -->
    <path d="M 200,60 C 230,45 290,30 380,40 C 340,52 280,62 230,68 Z" fill="url(#silverWingGrad)" opacity="0.95" />
    <path d="M 200,62 C 225,50 280,42 360,50 C 325,58 270,68 225,73 Z" fill="url(#silverWingGrad)" opacity="0.9" />
    <path d="M 200,65 C 220,56 265,52 335,60 C 305,66 255,74 220,78 Z" fill="url(#silverWingGrad)" opacity="0.85" />
    <path d="M 200,68 C 215,62 250,60 310,68 C 285,73 245,79 215,82 Z" fill="url(#silverWingGrad)" opacity="0.8" />
    <path d="M 200,72 C 210,68 235,68 280,76 C 260,80 230,84 210,86 Z" fill="url(#silverWingGrad)" opacity="0.75" />

    <!-- Center Arch Spine / Feather Lines -->
    <path d="M 50,45 Q 200,78 350,45" stroke="#71828A" stroke-width="1.2" fill="none" opacity="0.7" />
    <path d="M 80,54 Q 200,82 320,54" stroke="#71828A" stroke-width="1.2" fill="none" opacity="0.7" />
    <path d="M 110,63 Q 200,86 290,63" stroke="#71828A" stroke-width="1.2" fill="none" opacity="0.7" />

    <!-- Center Enamel Badge Plaque -->
    <rect x="110" y="46" width="180" height="24" rx="4" fill="url(#amrGreenGrad)" stroke="#B8C5CC" stroke-width="1.5" />
    
    <!-- Fine Gold Inner Border Line -->
    <rect x="112" y="48" width="176" height="20" rx="3" fill="none" stroke="#C4F53C" stroke-width="0.8" opacity="0.8" />

    <!-- Aston Martin Typography in Badge -->
    <text x="200" y="62" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="3.8" fill="#FFFFFF">ASTON MARTIN</text>
  </g>
</svg>
